name: CI

# Deterministic, LLM-free CI. No model calls, no auth, no secrets.
#   * validate      — static plugin/skill checks + the repo's LLM-free unit tests.
#   * install-smoke — proves the plugin *installs* on codex, claude, pi, and
#                     opencode with no authentication and no model calls (verified
#                     in a fresh, credential-free container before this job was
#                     written).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (deterministic, no LLM)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin artifacts (manifests, skills, marketplace)
        run: python3 tests/validate_plugin.py

      - name: Run LLM-free unit tests
        # The E2E round-trip test self-skips unless AGENT_TALK_E2E=1 and retalk is
        # on PATH, so `discover` stays network-free / auth-free here.
        run: python3 -m unittest discover -s tests -v

  install-smoke:
    name: install-smoke (codex + claude + pi + opencode, no auth)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pi requires Node >= 22.19; "22" resolves to the latest 22.x.
          node-version: "22"

      - name: Install agent CLIs
        run: |
          npm i -g @anthropic-ai/claude-code @openai/codex opencode-ai
          npm i -g --ignore-scripts @earendil-works/pi-coding-agent

      # ---- codex ------------------------------------------------------------
      # Verified auth-free in a fresh container: `codex plugin marketplace add` +
      # `codex plugin add` land the plugin under
      # ~/.codex/plugins/cache/agent-talk/agent-talk/<version>/ with no login.
      - name: codex — add marketplace and install plugin
        run: |
          codex plugin marketplace add "$PWD"
          codex plugin add agent-talk@agent-talk

      - name: codex — assert all 14 skills landed in the cache
        run: |
          set -euo pipefail
          root="$HOME/.codex/plugins/cache/agent-talk/agent-talk"
          dir="$(find "$root" -mindepth 2 -maxdepth 2 -type d -name skills | head -n1)"
          if [ -z "$dir" ]; then
            echo "codex: no skills dir under $root" >&2
            find "$root" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          count="$(find "$dir" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          echo "codex skills dir: $dir  (SKILL.md count: $count)"
          test "$count" -eq 14

      # ---- claude -----------------------------------------------------------
      # Verified auth-free in a fresh container: `claude plugin marketplace add` +
      # `claude plugin install` land the plugin under
      # ~/.claude/plugins/cache/agent-talk/agent-talk/<version>/ with no login.
      - name: claude — add marketplace and install plugin
        run: |
          claude plugin marketplace add "$PWD"
          claude plugin install agent-talk@agent-talk

      - name: claude — assert all 14 skills landed in the cache
        run: |
          set -euo pipefail
          root="$HOME/.claude/plugins/cache/agent-talk/agent-talk"
          dir="$(find "$root" -mindepth 2 -maxdepth 2 -type d -name skills | head -n1)"
          if [ -z "$dir" ]; then
            echo "claude: no skills dir under $root" >&2
            find "$root" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          count="$(find "$dir" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          echo "claude skills dir: $dir  (SKILL.md count: $count)"
          test "$count" -eq 14

      # ---- pi ---------------------------------------------------------------
      # Verified auth-free and offline in a fresh container: `pi install <path>`
      # adds the checked-out repo (pi discovers its skills/ directory), and pi's
      # RPC `get_commands` enumerates all 14 skills with no login and no model
      # call. PI_OFFLINE disables startup network operations.
      - name: pi — install the plugin from the checked-out repo
        env:
          PI_OFFLINE: "1"
        run: pi install "$PWD"

      - name: pi — assert all 14 skills are discovered
        env:
          PI_OFFLINE: "1"
        run: |
          set -euo pipefail
          out="$(printf '%s\n' '{"id":"1","type":"get_commands"}' \
            | pi --mode rpc --no-session --offline)"
          count="$(printf '%s' "$out" | tr ',' '\n' | grep -c '"name":"skill:')"
          echo "pi skills discovered: $count"
          test "$count" -eq 14

      # The inbox-monitor extension notifies on session_start when
      # AGENT_TALK_PI_SPOOLS is set. That notify proves the extension loaded and
      # attached its watcher. Auth-free and offline (no model call).
      - name: pi — assert the inbox-monitor extension loads and attaches
        env:
          PI_OFFLINE: "1"
        run: |
          set -euo pipefail
          spool="$(mktemp)"
          out="$(printf '%s\n' '{"id":"1","type":"get_state"}' \
            | AGENT_TALK_PI_SPOOLS="$spool" pi --mode rpc --no-session --offline)"
          printf '%s' "$out" | grep -q 'agent-talk: watching' \
            || { echo "pi: inbox-monitor extension did not attach" >&2; exit 1; }
          echo "pi inbox-monitor extension: attached"

      # ---- opencode ---------------------------------------------------------
      # Verified auth-free and offline in a fresh container: opencode discovers
      # SKILL.md files from fixed skill directories (no plugin manifest), so
      # symlinking this repo's skills/ into ~/.config/opencode/skills makes all
      # 14 skills discoverable. `opencode debug skill` enumerates them as JSON
      # with no login and no model call.
      - name: opencode — install skills into the global skills directory
        run: |
          set -euo pipefail
          opencode --version
          mkdir -p "$HOME/.config/opencode"
          ln -s "$PWD/skills" "$HOME/.config/opencode/skills"

      - name: opencode — assert all 14 skills are discovered
        run: |
          set -euo pipefail
          # Run inside a throwaway git repo so opencode resolves a worktree root.
          work="$(mktemp -d)"
          git -C "$work" init -q
          opencode debug skill > "$work/skills.json" 2>/dev/null
          count="$(python3 -c 'import json,sys; want={"add","block","config","contacts","history","id","import","init","receive","relay","send","share","sync","verify"}; data=json.load(open(sys.argv[1])); print(len(want & {s.get("name") for s in data}))' "$work/skills.json")"
          echo "opencode skills discovered: $count"
          test "$count" -eq 14

  install-smoke-antigravity:
    name: install-smoke (antigravity, no auth)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The Antigravity CLI ships as a single native binary via an official
      # installer script (no npm, no Node). Verified auth-free in a fresh
      # container: the install script and `agy plugin install <dir>` both run
      # with no Google login, so no secrets are needed for this job.
      - name: Install the Antigravity CLI (agy)
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: antigravity — install the plugin from the checkout
        run: |
          set -euo pipefail
          agy --version
          # Antigravity reads the Claude Code plugin layout
          # (.claude-plugin/plugin.json + top-level skills/) at the repo root.
          agy plugin install "$PWD"
          agy plugin list

      - name: antigravity — assert all 14 skills landed in the cache
        run: |
          set -euo pipefail
          dir="$HOME/.gemini/config/plugins/agent-talk/skills"
          if [ ! -d "$dir" ]; then
            echo "antigravity: no skills dir at $dir" >&2
            find "$HOME/.gemini/config/plugins" -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          count="$(find "$dir" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          echo "antigravity skills dir: $dir  (SKILL.md count: $count)"
          test "$count" -eq 14
